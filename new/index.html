<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Telecom - Business Communication Solutions</title>
    <meta name="description" content="Enterprise cloud communication platform. Virtual PBX, WhatsApp Business API, AI Agents, and more.">
    <meta name="keywords" content="virtual pbx, whatsapp business, ai agents, business communication">
    <link rel="icon" type="image/png" href="images/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .language-selector {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            padding: 2rem;
        }

        .selector-container {
            background: white;
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            margin-bottom: 2rem;
        }

        .logo-container img {
            height: 56px;
            width: auto;
        }

        .selector-container h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #111827;
            font-weight: 700;
            line-height: 1.2;
        }

        .selector-container .subtitle {
            color: #6b7280;
            margin-bottom: 2.5rem;
            font-size: 1.125rem;
            line-height: 1.6;
        }

        .language-options {
            display: grid;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .lang-option {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.5rem;
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            text-decoration: none;
            color: #111827;
            font-size: 1.25rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .lang-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.1), transparent);
            transition: left 0.5s;
        }

        .lang-option:hover::before {
            left: 100%;
        }

        .lang-option:hover {
            background: #fff7ed;
            border-color: #f97316;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.3);
        }

        .lang-option:active {
            transform: translateY(0);
        }

        .lang-flag {
            font-size: 2.5rem;
            line-height: 1;
        }

        .lang-name {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .lang-name-primary {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .lang-name-native {
            font-size: 0.875rem;
            color: #6b7280;
            font-weight: 400;
        }

        .auto-redirect {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
        }

        .auto-redirect-text {
            color: #6b7280;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .loading-dots {
            display: inline-flex;
            gap: 0.25rem;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            background: #f97316;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .countdown {
            font-weight: 600;
            color: #f97316;
        }

        .skip-auto {
            margin-top: 1rem;
        }

        .skip-button {
            background: transparent;
            border: 1px solid #e5e7eb;
            color: #6b7280;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .skip-button:hover {
            border-color: #f97316;
            color: #f97316;
            background: #fff7ed;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
        }

        .feature {
            text-align: center;
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .feature-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.25rem;
        }

        .feature-text {
            font-size: 0.75rem;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .selector-container {
                padding: 2rem;
            }

            .selector-container h1 {
                font-size: 1.875rem;
            }

            .lang-option {
                padding: 1.25rem;
                font-size: 1.125rem;
            }

            .lang-flag {
                font-size: 2rem;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .selector-container {
                padding: 1.5rem;
            }

            .selector-container h1 {
                font-size: 1.5rem;
            }

            .logo-container img {
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="language-selector">
        <div class="selector-container">
            <div class="logo-container">
                <img src="images/logo.png" alt="Universal Telecom" id="logo">
            </div>
            
            <h1>Welcome to Universal Telecom</h1>
            <p class="subtitle">
                Select your language / Selecciona tu idioma / Sélectionnez votre langue
            </p>
            
            <div class="language-options">
                <a href="es/index.html" class="lang-option" data-lang="es">
                    <span class="lang-flag">🇪🇸</span>
                    <span class="lang-name">
                        <span class="lang-name-primary">Spanish</span>
                        <span class="lang-name-native">Español</span>
                    </span>
                </a>
                
                <a href="en/index.html" class="lang-option" data-lang="en">
                    <span class="lang-flag">🇬🇧</span>
                    <span class="lang-name">
                        <span class="lang-name-primary">English</span>
                        <span class="lang-name-native">English</span>
                    </span>
                </a>
                
                <a href="fr/index.html" class="lang-option" data-lang="fr">
                    <span class="lang-flag">🇫🇷</span>
                    <span class="lang-name">
                        <span class="lang-name-primary">French</span>
                        <span class="lang-name-native">Français</span>
                    </span>
                </a>
            </div>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🏢</div>
                    <div class="feature-title">2,000+</div>
                    <div class="feature-text">Business Clients</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🌍</div>
                    <div class="feature-title">9+</div>
                    <div class="feature-text">Countries</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <div class="feature-title">99.9%</div>
                    <div class="feature-text">Uptime</div>
                </div>
            </div>

            <div class="auto-redirect">
                <p class="auto-redirect-text">
                    Auto-detecting your language
                    <span class="loading-dots">
                        <span class="loading-dot"></span>
                        <span class="loading-dot"></span>
                        <span class="loading-dot"></span>
                    </span>
                </p>
                <p class="auto-redirect-text">
                    Redirecting in <span class="countdown" id="countdown">3</span> seconds
                </p>
                <div class="skip-auto">
                    <button class="skip-button" id="skipButton">Stay on this page</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Language detection and auto-redirect
        let countdownValue = 3;
        let countdownInterval;
        let autoRedirectEnabled = true;

        const countdownElement = document.getElementById('countdown');
        const skipButton = document.getElementById('skipButton');
        const logo = document.getElementById('logo');

        // Fallback for logo if it fails to load
        logo.onerror = function() {
            this.style.display = 'none';
        };

        // Skip auto-redirect
        skipButton.addEventListener('click', function() {
            autoRedirectEnabled = false;
            clearInterval(countdownInterval);
            document.querySelector('.auto-redirect').innerHTML = '<p class="auto-redirect-text" style="color: #059669;">✓ Auto-redirect disabled. Please select your language above.</p>';
        });

        // Countdown timer
        countdownInterval = setInterval(() => {
            countdownValue--;
            countdownElement.textContent = countdownValue;
            
            if (countdownValue <= 0) {
                clearInterval(countdownInterval);
                if (autoRedirectEnabled) {
                    performRedirect();
                }
            }
        }, 1000);

        // Detect language and redirect
        function performRedirect() {
            const userLang = navigator.language || navigator.userLanguage;
            let redirect = 'es/index.html'; // Default to Spanish
            
            console.log('Detected language:', userLang);
            
            if (userLang.startsWith('en')) {
                redirect = 'en/index.html';
            } else if (userLang.startsWith('fr')) {
                redirect = 'fr/index.html';
            } else if (userLang.startsWith('es')) {
                redirect = 'es/index.html';
            }
            
            // Store language preference
            try {
                localStorage.setItem('preferredLanguage', redirect.split('/')[0]);
            } catch (e) {
                console.log('LocalStorage not available');
            }
            
            window.location.href = redirect;
        }

        // Check if user has a stored language preference
        try {
            const preferredLang = localStorage.getItem('preferredLanguage');
            if (preferredLang) {
                console.log('Found stored preference:', preferredLang);
                // Highlight the preferred language option
                const preferredOption = document.querySelector(`[data-lang="${preferredLang}"]`);
                if (preferredOption) {
                    preferredOption.style.borderColor = '#f97316';
                    preferredOption.style.background = '#fff7ed';
                }
            }
        } catch (e) {
            console.log('LocalStorage not available');
        }

        // Track language selection clicks
        document.querySelectorAll('.lang-option').forEach(option => {
            option.addEventListener('click', function(e) {
                const lang = this.getAttribute('data-lang');
                try {
                    localStorage.setItem('preferredLanguage', lang);
                } catch (e) {
                    console.log('LocalStorage not available');
                }
                
                // Google Analytics event (if available)
                if (typeof gtag !== 'undefined') {
                    gtag('event', 'language_select', {
                        'language': lang,
                        'method': 'manual'
                    });
                }
            });
        });

        // Track auto-redirect
        window.addEventListener('beforeunload', function() {
            if (autoRedirectEnabled && countdownValue <= 0) {
                if (typeof gtag !== 'undefined') {
                    gtag('event', 'language_select', {
                        'language': 'auto',
                        'method': 'automatic'
                    });
                }
            }
        });
    </script>
</body>
</html>
